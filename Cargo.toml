[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/guyco3/celld-cdc"

[workspace.dependencies]
celld-ltx = { git = "https://github.com/denoland/celld", tag = "v0.6.3", default-features = false, features = ["s3"] }
rusqlite = { version = "0.31", features = ["bundled"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
async-trait = "0.1"
percent-encoding = "2"
tempfile = "3"

# Local development against a checkout of celld next to this repo:
# [patch."https://github.com/denoland/celld"]
# celld-ltx = { path = "../celld/crates/ltx" }

[profile.release]
# Fast enough to build in a container, small enough to ship.
codegen-units = 16
debug = false
strip = true
